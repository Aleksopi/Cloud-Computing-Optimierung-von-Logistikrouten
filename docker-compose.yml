version: '3.8'

services:
  logistik:
    build: .
    mem_limit: 12g
    container_name: logistik-projekt
    ports:
      - "7474:7474"
      - "7687:7687"
      - "8888:8888"
      - "5002:5000"
    volumes:
      - ./workspace:/workspace
      - neo4j_data:/opt/neo4j/data
      - jupyter_config:/root/.jupyter
      - jupyter_data:/root/.local/share/jupyter
    environment:
      NEO4J_AUTH: neo4j/Tr0p1c@lM0nk3y92
    stdin_open: true
    tty: true

  osrm:
    image: osrm/osrm-backend
    platform: linux/amd64
    container_name: osrm
    ports:
      - "5001:5000"
    volumes:
      - ./workspace:/workspace
    command: >
      sh -c "
        PBF=/workspace/data/switzerland-260525-roads.osm.pbf
        OUTPUT_DIR=/workspace/data/generated
        GRAPH=$${OUTPUT_DIR}/switzerland-260525-roads.osrm
        
        if [ ! -f \"$${GRAPH}\" ]; then
          echo '⏳ Creating generated directory...'
          mkdir -p $${OUTPUT_DIR}
          
          echo '⏳ Preprocessing OSRM graph into generated subfolder...'
          osrm-extract -p /opt/car.lua $${PBF}
          
          # Move the extracted files into the generated subfolder
          # (osrm-extract generates files in the same directory as the PBF by default if not specified)
          mv /workspace/data/switzerland-260525-roads.osrm* $${OUTPUT_DIR}/
          
          osrm-partition $${GRAPH}
          osrm-customize $${GRAPH}
        fi
        
        echo '🚀 Starting OSRM routing engine...'
        osrm-routed --algorithm mld --max-table-size 10000 $${GRAPH}
      "

volumes:
  neo4j_data:
  jupyter_config:
  jupyter_data:
